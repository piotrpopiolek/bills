version: '3.8'

# Docker Compose dla testowania tylko frontendu (backend uruchomiony lokalnie)
#
# Użycie: docker-compose -f docker-compose.test.yml up --build
#
# Jeśli proxy nie działa, sprawdź IP hosta i zaktualizuj BACKEND_URL:
#   1. docker exec bills-frontend-test getent hosts host.docker.internal
#   2. Zaktualizuj BACKEND_URL w environment poniżej z IP (np. http://192.168.65.254:8000)

services:
  frontend:
    build:
      context: .
      dockerfile: astro/Dockerfile
    container_name: bills-frontend-test
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
      # Dla lokalnego testowania użyj IP zamiast host.docker.internal
      # IP można znaleźć: docker exec bills-frontend-test getent hosts host.docker.internal
      # Domyślnie używamy host.docker.internal - jeśli nie działa, zmień na IP
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:8000}
      - PUBLIC_SITE_URL=http://localhost:8080
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '--quiet', 'http://localhost:8080/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
