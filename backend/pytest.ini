[pytest]
# Pytest configuration for Bills backend


python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

testpaths = tests

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --import-mode=importlib
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

timeout = 60
timeout_method = thread

markers =
    unit: Unit tests (no database, no FastAPI, no network)
    integration: Integration tests against Postgres, one layer, external HTTP mocked
    e2e: End-to-end tests through the ASGI app or a mocked Telegram update
    slow: Slow running tests
    api: API endpoint tests
    auth: Authentication related tests
    telegram: Telegram bot related tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:\s*All support for the:FutureWarning
    ignore:urllib3 .*supported version:Warning
