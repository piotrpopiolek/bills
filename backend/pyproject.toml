[project]
name = "bills-backend"
version = "0.1.0"
description = "Bills receipt backend"
requires-python = ">=3.14"
dependencies = [
    "Mako==1.3.12",
    "MarkupSafe==3.0.2",
    "SQLAlchemy==2.0.41",
    "annotated-types==0.7.0",
    "anyio==4.14.2",
    "asyncpg==0.31.0",
    "click==8.3.3",
    "colorama==0.4.6",
    "fastapi==0.141.1",
    "google-api-core>=2.11.0",
    "google-generativeai>=0.8.0",
    "greenlet==3.2.3",
    "gunicorn==23.0.0",
    "h11==0.16.0",
    "httpx==0.27.2",
    "idna==3.15",
    "openai==2.8.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.10.1",
    "pydantic_core==2.46.5",
    "PyJWT==2.15.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.31",
    "python-telegram-bot==22.8",
    "requests==2.33.0",
    "sentry-sdk[fastapi]==2.75.0",
    "sniffio==1.3.1",
    "sqlmodel==0.0.24",
    "starlette==1.3.1",
    "supabase>=2.10.0",
    "tenacity>=8.2.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "uvicorn==0.35.0",
    "pgvector==0.5.1",
    "langchain-core==1.8.4",
]

[dependency-groups]
dev = [
    "aiosqlite==0.20.0",
    "mypy==1.15.0",
    "pip-audit==2.9.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.6.1",
    "ruff==0.15.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Ruff format does not wrap string literals. E501 on those lines would fail
# existing modules; line length is enforced by ruff format.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.14"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
packages = ["src"]
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
# Measured coverage is 43.06%. Target gate at 80.
fail_under = 43
show_missing = true
skip_covered = true
