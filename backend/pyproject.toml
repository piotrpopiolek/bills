[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Ruff format does not wrap string literals. E501 on those lines would fail
# existing modules; line length is enforced by ruff format.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.13"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
packages = ["src"]
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
# Measured coverage is 43.06%. Target gate at 80.
fail_under = 43
show_missing = true
skip_covered = true
