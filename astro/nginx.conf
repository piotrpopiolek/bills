server {
    listen ${PORT};
    server_name _;

    # Reverse proxy for Astro SSR server
    # Use this only if you run nginx in front of the Astro Node server.

    # Fix for Railway: Prevent port 8080 in redirect Location headers
    port_in_redirect off;
    absolute_redirect on;

    # Remove port from Host header if present
    set $host_without_port $host;
    if ($host ~* ^([^:]+):) {
        set $host_without_port $1;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Forwarded headers
    add_header X-Forwarded-Host $host_without_port always;
    add_header X-Forwarded-Proto "https" always;

    # Proxy all traffic to the Astro SSR server (run it on 8081 if nginx uses ${PORT})
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host_without_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}