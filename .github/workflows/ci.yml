name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend
        with:
          requirements-file: requirements-lint.txt

      - name: ruff check
        run: ruff check src tests

      - name: ruff format --check
        run: ruff format --check src tests

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend
        with:
          requirements-file: requirements-dev.txt

      - name: mypy
        run: mypy src

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: test
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      TELEGRAM_BOT_TOKEN: ci-telegram-token
      OPENAI_API_KEY: ci-openai-key
      GEMINI_API_KEY: ci-gemini-key
      JWT_SECRET_KEY: ci-jwt-secret-key-for-testing-only
      WEB_APP_URL: http://localhost:4321
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend
        with:
          requirements-file: requirements-dev.txt

      - name: Apply schema
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for file in ../supabase/migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: pytest
        run: python -m pytest -q --tb=short -o log_cli=false

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend (astro check + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run astro check

      - name: Vitest
        run: npm run test:ci

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Audit production dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.9.0
          pip-audit -r requirements.txt

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t bills-backend:ci .

      - name: Build frontend image
        run: docker build -f astro/Dockerfile -t bills-frontend:ci .
