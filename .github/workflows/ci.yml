name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: ruff check
        run: uv run ruff check src tests

      - name: ruff format --check
        run: uv run ruff format --check src tests

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: mypy
        run: uv run mypy src

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: test
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      TELEGRAM_BOT_TOKEN: ci-telegram-token
      OPENAI_API_KEY: ci-openai-key
      GEMINI_API_KEY: ci-gemini-key
      JWT_SECRET_KEY: ci-jwt-secret-key-for-testing-only
      WEB_APP_URL: http://localhost:4321
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Apply schema
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for file in ../supabase/migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Redis is up
        run: uv run python -c "import redis; redis.Redis.from_url('redis://localhost:6379/0').ping()"

      - name: pytest
        run: uv run pytest -q --tb=short -o log_cli=false

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend (astro check + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run astro check

      - name: Vitest
        run: npm run test:ci

  e2e-playwright:
    name: E2E Playwright (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, msedge]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: test
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      TELEGRAM_BOT_TOKEN: ci-telegram-token
      OPENAI_API_KEY: ci-openai-key
      GEMINI_API_KEY: ci-gemini-key
      JWT_SECRET_KEY: ci-jwt-secret-key-for-testing-only
      WEB_APP_URL: http://localhost:4321
      BACKEND_URL: http://127.0.0.1:8000
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Apply schema
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for file in supabase/migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Playwright
        run: |
          uv run --directory ../backend uvicorn main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}
          path: astro/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.14"

      - name: Audit production dependencies
        working-directory: backend
        run: uv run --frozen --no-dev --with pip-audit==2.9.0 pip-audit

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t bills-backend:ci .

      - name: Build frontend image
        run: docker build -f astro/Dockerfile -t bills-frontend:ci .
