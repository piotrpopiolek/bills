name: Setup backend Python
description: Install pinned uv 0.13.9 and sync the backend lock
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10
      with:
        version: "0.13.9"
        python-version: "3.14"
        enable-cache: true
        cache-dependency-glob: backend/uv.lock
    - name: Sync dependencies
      shell: bash
      working-directory: backend
      run: uv sync --frozen
